<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão</title>
</head>

<body>
    <header>
        <h1>Minha Empresa</h1>
        <a href="#Nossos-servicos" class="Servicos">Sobre Empresa</a>
        <a href="#sobre" class="Servicos">Nossos Serviços</a>
    </header>
    <main>
        <section id="sobre" class="container">
            <h2>Sobre a empresa</h2>
            <img class="img"
                src="https://media.istockphoto.com/id/1947499362/pt/foto/happy-group-of-business-people-discussing-strategy-during-team-meeting-at-the-office-desk.jpg?s=612x612&w=0&k=20&c=uRGzgkLzqNbeNy7GSvfRt_SQA-LrkMMLZzsV6ZNaopE=">
            <p>
                Somos uma empresa dedicada a oferecer produtos
                e serviços de qualidade, buscando sempre atender
                às necessidades dos nossos clientes.
            </p>
        </section>
        <section id="Nossos-servicos" class="container">
            <h2>Nossos Serviços</h2>
            <img class="img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSVmcS7iwJqDq-JhoQU3sVf-tViCQqCtJue7XyoRxMO3Nr-yhIwKNj4D5Q&s=10"
                alt="">
            <p> um de nossos serviços e a criação de sites e programas </p>
            </section>
            <div id="cadastro">
                <h3>Seja Cliente!</h3>
                <label for="nome"> Nome Completo: </label>
                <input type="text" id="nome" name="nome"> <br>

                <label for="Email"> Email: </label>
                <input type="email" id="Email" email="email"><br>

                <label for="telefone"> Telefone: </label>
                <input type="text" id="telefone" telefone="telefone"><br>
                <button> Enviar cadastro</button>
            </div>
        
    </main>
</body>

</html>
